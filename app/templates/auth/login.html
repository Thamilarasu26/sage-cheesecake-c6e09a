{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="auth-card-wrapper">
    <div class="auth-card card shadow-lg border-0">
      <div class="card-body p-4 p-md-5">
        <!-- Header -->
        <div class="text-center mb-4">
          <div class="auth-logo mb-3">
            <i class="bi bi-cloud-fill"></i>
          </div>
          <h1 class="h3 fw-bold">Welcome Back</h1>
          <p class="text-muted small">Sign in to access your CloudShare dashboard</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" id="loginForm" novalidate>
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label fw-medium">Email Address</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="email" name="email"
                     placeholder="you@example.com"
                     required autocomplete="email" />
            </div>
          </div>

          <!-- Password -->
          <div class="mb-3">
            <label for="password" class="form-label fw-medium">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="password" name="password"
                     placeholder="Your password"
                     required autocomplete="current-password" />
              <button class="btn btn-outline-secondary" type="button"
                      onclick="togglePwVisibility('password', this)">
                <i class="bi bi-eye"></i>
              </button>
            </div>
          </div>

          <!-- Remember me -->
          <div class="mb-4 d-flex justify-content-between align-items-center">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" name="remember" />
              <label class="form-check-label small" for="remember">Remember me</label>
            </div>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="loginBtn">
            <i class="bi bi-box-arrow-in-right me-2"></i> Sign In
          </button>
        </form>

        <hr class="my-4" />

        <p class="text-center text-muted small mb-0">
          Don't have an account?
          <a href="{{ url_for('auth.register') }}" class="fw-semibold">Create one free</a>
        </p>
      </div>
    </div>
  </div>
</section>
{% endblock %}
