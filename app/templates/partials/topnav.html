<!-- Top Navigation Bar (authenticated) -->
<header class="topnav" id="topnav">
  <div class="topnav-left">
    <button class="btn btn-link topnav-toggle" onclick="toggleSidebar()" aria-label="Toggle sidebar">
      <i class="bi bi-list fs-4"></i>
    </button>
    <nav aria-label="breadcrumb" class="ms-2 d-none d-md-block">
      <ol class="breadcrumb mb-0">
        <li class="breadcrumb-item"><a href="{{ url_for('files.dashboard') }}">Home</a></li>
        {% block breadcrumb %}{% endblock %}
      </ol>
    </nav>
  </div>

  <div class="topnav-right d-flex align-items-center gap-3">
    <!-- Quick upload -->
    <a href="{{ url_for('files.upload') }}" class="btn btn-primary btn-sm d-none d-sm-inline-flex align-items-center gap-1">
      <i class="bi bi-cloud-upload"></i> Upload
    </a>

    <!-- Profile dropdown -->
    <div class="dropdown">
      <button class="btn btn-link p-0 d-flex align-items-center gap-2 text-decoration-none"
              id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
        <div class="avatar">{{ current_user.name[0].upper() }}</div>
        <span class="d-none d-md-inline fw-medium text-body">{{ current_user.name }}</span>
        <i class="bi bi-chevron-down small text-muted"></i>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm">
        <li><h6 class="dropdown-header">{{ current_user.email }}</h6></li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <a class="dropdown-item" href="{{ url_for('auth.profile') }}">
            <i class="bi bi-person me-2"></i>Profile & Settings
          </a>
        </li>
        <li>
          <a class="dropdown-item text-danger" href="{{ url_for('auth.logout') }}">
            <i class="bi bi-box-arrow-right me-2"></i>Logout
          </a>
        </li>
      </ul>
    </div>
  </div>
</header>
